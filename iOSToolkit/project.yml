name: iOSToolkit
options:
  bundleIdPrefix: com.realmios
  deploymentTarget:
    iOS: "16.0"
packages:
  ApplePackage:
    url: https://github.com/Lakr233/ApplePackage.git
    from: 2.0.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
  OpenSSL:
    url: https://github.com/Lakr233/openssl-spm.git
    from: 4.0.1
targets:
  iOSToolkit:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: zsign/src
        excludes:
          - "**/*.md"
    dependencies:
      - package: ApplePackage
        product: ApplePackage
      - package: OpenSSL
        product: OpenSSL
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: iOS Toolkit
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        UIBackgroundModes:
          - audio
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realmios.ioskit
        PRODUCT_NAME: iOSToolkit
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/iOSToolkit-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        HEADER_SEARCH_PATHS:
          - zsign/src
          - zsign/src/common
          - zsign/src/third-party/zlib
          - zsign/src/third-party/minizip
          - zsign/openssl/include
        OTHER_CPLUSPLUSFLAGS:
          - -std=gnu++17
          - -w
          - -include
          - cstdint
          - -include
          - cstring
          - -include
          - cstdlib
          - -include
          - cstdio
          - -include
          - string
          - -include
          - vector
          - -include
          - map
          - -include
          - set
          - -include
          - functional
          - -include
          - algorithm
          - -include
          - memory
          - -include
          - sstream
        OTHER_CFLAGS:
          - -w

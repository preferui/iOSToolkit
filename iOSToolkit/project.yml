name: iOSToolkit
options:
  bundleIdPrefix: com.realmios
  deploymentTarget:
    iOS: "16.0"
packages:
  ApplePackage:
    url: https://github.com/Lakr233/ApplePackage.git
    from: 2.0.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
  OpenSSL:
    url: https://github.com/Lakr233/openssl-spm.git
    from: 4.0.1
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 4.3.1
  SwiftASN1:
    url: https://github.com/apple/swift-asn1.git
    exactVersion: 1.6.0
  AnisetteKit:
    url: https://github.com/mahee96/anisettekit.git
    branch: main
  GSACryptoKit:
    url: https://github.com/mahee96/gsacryptokit.git
    branch: main
  CodeSignKit:
    url: https://github.com/mahee96/codesignkit.git
    branch: main
targets:
  iOSToolkit:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: ApplePackage
        product: ApplePackage
      - package: OpenSSL
        product: OpenSSL
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftCrypto
        product: CryptoExtras
      - package: SwiftASN1
        product: SwiftASN1
      - package: AnisetteKit
        product: AnisetteKit
      - package: GSACryptoKit
        product: GSACryptoKit
      - package: CodeSignKit
        product: CodeSignKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: iOS Toolkit
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        UIBackgroundModes:
          - audio
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realmios.ioskit
        PRODUCT_NAME: iOSToolkit
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

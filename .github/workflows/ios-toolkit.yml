name: Build iOS Toolkit IPA
on:
  workflow_dispatch:
  push:
    branches: [main, feature/ipa-clone-editor]
    paths: ['iOSToolkit/**', '.github/workflows/ios-toolkit.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Chọn Xcode mới nhất (không beta)
        run: |
          set -euo pipefail
          best_path=""; best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in *beta*|*_rc*) continue ;; esac
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then best_ver="$ver"; best_path="$app"; fi
          done
          echo "Xcode $best_ver ($best_path)"
          sudo xcode-select -s "$best_path"
          xcodebuild -version
      - name: Cài iOS platform và XcodeGen
        run: |
          xcodebuild -downloadPlatform iOS || true
          brew install xcodegen
      - name: Tải mã nguồn zsign và vá cho iOS
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zhlynn/zsign.git "$HOME/zsign-src"
          Z="$HOME/zsign-src/src"
          perl -pi -e 's/^int main\(int argc, char\* argv\[\]\)/int zsign_main(int argc, char* argv[])/' "$Z/zsign.cpp"
          perl -pi -e 's/pid_t pid = fork\(\);/pid_t pid = -1;/; s/^\s*execlp\(.*$//' "$Z/zsign.cpp"
          grep -n "zsign_main" "$Z/zsign.cpp" | head -2
          DEST="$GITHUB_WORKSPACE/iOSToolkit/zsign/src"
          mkdir -p "$DEST/common" "$DEST/third-party/zlib" "$DEST/third-party/minizip"
          cp "$Z"/*.cpp "$Z"/*.h "$DEST/" 2>/dev/null || true
          cp "$Z"/common/*.cpp "$Z"/common/*.h "$DEST/common/" 2>/dev/null || true
          cp "$Z"/third-party/zlib/*.c "$Z"/third-party/zlib/*.h "$DEST/third-party/zlib/" 2>/dev/null || true
          cp "$Z"/third-party/minizip/ioapi.c "$Z"/third-party/minizip/unzip.c "$Z"/third-party/minizip/zip.c "$Z"/third-party/minizip/mztools.c "$DEST/third-party/minizip/" 2>/dev/null || true
          cp "$Z"/third-party/minizip/*.h "$DEST/third-party/minizip/" 2>/dev/null || true
          find "$DEST" -type f | sort
      - name: Cache thư viện idevice-ffi (Rust) cho tính năng đồng bộ thiết bị
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: iOSToolkit/idevice
          key: idevice-ffi-v1-89702099f4d7552f704f93b4526756abda319ceb
      - name: Build thư viện idevice-ffi (Rust) — cầu nối tới RemotePairing/lockdown của thiết bị
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          # Ghim đúng 1 commit cụ thể (thay vì HEAD trôi nổi) để build luôn tái lập được giống nhau.
          mkdir -p "$HOME/idevice-src" && cd "$HOME/idevice-src"
          git init -q
          git remote add origin https://github.com/jkcoxson/idevice.git
          git fetch --depth 1 origin 89702099f4d7552f704f93b4526756abda319ceb
          git checkout -q FETCH_HEAD
          cd ffi
          RUSTFLAGS="-C link-arg=-miphoneos-version-min=16.0" \
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          cargo build --release --target aarch64-apple-ios --features obfuscate
          DEST="$GITHUB_WORKSPACE/iOSToolkit/idevice"
          mkdir -p "$DEST/include" "$DEST/lib"
          cp idevice.h "$DEST/include/idevice.h"
          cp "../target/aarch64-apple-ios/release/libidevice_ffi.a" "$DEST/lib/libidevice_ffi.a"
          ls -la "$DEST/include" "$DEST/lib"
      - name: Kiểm tra idevice-ffi đã sẵn sàng (dù lấy từ cache hay vừa build)
        run: |
          set -euo pipefail
          test -f iOSToolkit/idevice/include/idevice.h
          test -f iOSToolkit/idevice/lib/libidevice_ffi.a
          ls -la iOSToolkit/idevice/include iOSToolkit/idevice/lib
      - name: Lấy header OpenSSL (dùng chung thư viện OpenSSL đã có sẵn trong app, không build/link thêm bản riêng để tránh trùng symbol)
        run: |
          set -euo pipefail
          curl -sS -L -o "$HOME/libssl.xcframework.zip" "https://github.com/Lakr233/openssl-spm/releases/download/storage.4.0.1/libssl.xcframework.zip"
          mkdir -p "$HOME/libssl-xc"
          unzip -q "$HOME/libssl.xcframework.zip" "OpenSSL.Package.xcframework/ios-arm64_arm64e/*" -d "$HOME/libssl-xc"
          mkdir -p "$GITHUB_WORKSPACE/iOSToolkit/zsign/openssl/include"
          cp -R "$HOME/libssl-xc/OpenSSL.Package.xcframework/ios-arm64_arm64e/libssl.framework/Headers/openssl" "$GITHUB_WORKSPACE/iOSToolkit/zsign/openssl/include/"
          ls "$GITHUB_WORKSPACE/iOSToolkit/zsign/openssl/include/openssl" | wc -l
      - name: Tạo project và build
        shell: bash
        run: |
          set +e
          cd iOSToolkit
          xcodegen generate
          mkdir -p iOSToolkit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved iOSToolkit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -project iOSToolkit.xcodeproj -scheme iOSToolkit -configuration Release \
            -derivedDataPath ../build -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          grep -E "async-http-client|swift-nio|applepackage" ../build.log | grep -iE "resolved|checking out|Fetched" | sort -u | head -20
          if [ $rc -ne 0 ]; then
            { grep -E "error:|error " ../build.log; grep -A 30 -E "Undefined symbol|duplicate symbol|ld: " ../build.log; } | sort -u | head -80 > ../errors.txt || true
            while IFS= read -r l; do echo "::error::${l:0:400}"; done < ../errors.txt
            exit $rc
          fi
      - name: Đóng gói IPA
        run: |
          APP=$(find build -name "iOSToolkit.app" -path "*Release-iphoneos*" | head -1)
          echo "APP=$APP"
          BIN="$APP/iOSToolkit"
          if [ ! -x "$BIN" ]; then
            echo "::error::Không thấy file thực thi $BIN trong app bundle — build coi như lỗi dù xcodebuild báo thành công."
            find build -iname "iOSToolkit*" -maxdepth 6 2>/dev/null | head -40
            tail -n 200 build.log 2>/dev/null || true
            exit 1
          fi
          file "$BIN"
          mkdir -p ipa/Payload out
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../out/iOSToolkit.ipa Payload
          ls -la ../out
      - name: Phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "tk-${{ github.run_number }}" out/iOSToolkit.ipa --title "iOS Toolkit build ${{ github.run_number }}" --notes "iOS Toolkit - bo cong cu cho iOS"
      - uses: actions/upload-artifact@v4
        with: { name: iOSToolkit-ipa, path: out/ }

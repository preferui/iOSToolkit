name: Build iOS Toolkit IPA
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/apple-music-injection']
    paths: ['iOSToolkit/**', '.github/workflows/ios-toolkit.yml', 'THIRD_PARTY_NOTICES.md']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Chọn Xcode mới nhất (không beta)
        run: |
          set -euo pipefail
          best_path=""; best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in *beta*|*_rc*) continue ;; esac
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then best_ver="$ver"; best_path="$app"; fi
          done
          echo "Xcode $best_ver ($best_path)"
          sudo xcode-select -s "$best_path"
          xcodebuild -version
      - name: Cài iOS platform và XcodeGen
        run: |
          xcodebuild -downloadPlatform iOS || true
          brew install xcodegen
      - name: Build idevice FFI và chuẩn bị engine ByeTunes
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

          git clone https://github.com/jkcoxson/idevice.git /tmp/idevice
          git -C /tmp/idevice checkout 89702099f4d7552f704f93b4526756abda319ceb
          cd /tmp/idevice
          IPHONEOS_DEPLOYMENT_TARGET=16.0 cargo build --release --package idevice-ffi --target aarch64-apple-ios
          test -s target/aarch64-apple-ios/release/libidevice_ffi.a
          test -s ffi/idevice.h

          git clone https://github.com/EduAlexxis/ByeTunes.git /tmp/ByeTunes
          git -C /tmp/ByeTunes checkout 945b9a3a7231c1b46795ee44587bf84a2f99a841
          cd "$GITHUB_WORKSPACE"
          mkdir -p iOSToolkit/Sources/AppleMusicEngine/Device/Manager
          mkdir -p iOSToolkit/Sources/AppleMusicEngine/Device/MediaLibrary
          mkdir -p iOSToolkit/Sources/AppleMusicEngine/Metadata/SongMetadata
          mkdir -p iOSToolkit/Sources/AppleMusicEngine/Core
          cp /tmp/ByeTunes/MusicManager/Device/Manager/*.swift iOSToolkit/Sources/AppleMusicEngine/Device/Manager/
          cp /tmp/ByeTunes/MusicManager/Device/MediaLibrary/*.swift iOSToolkit/Sources/AppleMusicEngine/Device/MediaLibrary/
          cp /tmp/ByeTunes/MusicManager/Metadata/SongMetadata/SongMetadata.swift iOSToolkit/Sources/AppleMusicEngine/Metadata/SongMetadata/
          cp /tmp/ByeTunes/MusicManager/Metadata/SongMetadata/SongMetadataLocalFile.swift iOSToolkit/Sources/AppleMusicEngine/Metadata/SongMetadata/
          cp /tmp/ByeTunes/MusicManager/Metadata/Lyrics/SongMetadataLyrics.swift iOSToolkit/Sources/AppleMusicEngine/Metadata/SongMetadata/
          cp /tmp/ByeTunes/MusicManager/Metadata/SongMetadataNetworking.swift iOSToolkit/Sources/AppleMusicEngine/Metadata/SongMetadata/
          cp /tmp/ByeTunes/MusicManager/Metadata/Providers/AppleMusicAPI.swift iOSToolkit/Sources/AppleMusicEngine/Metadata/SongMetadata/
          cp /tmp/ByeTunes/MusicManager/Core/Config.swift iOSToolkit/Sources/AppleMusicEngine/Core/
          cp /tmp/ByeTunes/MusicManager/Device/RemotePairingDiscovery.swift iOSToolkit/Sources/AppleMusicEngine/Device/
          cp /tmp/ByeTunes/MusicManager/Core/Logger.swift iOSToolkit/Sources/AppleMusicEngine/Core/
          cp /tmp/idevice/ffi/idevice.h iOSToolkit/Sources/idevice.h
          mkdir -p iOSToolkit/Vendor/idevice
          cp /tmp/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a iOSToolkit/Vendor/idevice/
      - name: Tạo project và build
        shell: bash
        run: |
          set +e
          cd iOSToolkit
          xcodegen generate
          mkdir -p iOSToolkit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved iOSToolkit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -project iOSToolkit.xcodeproj -scheme iOSToolkit -configuration Release \
            -derivedDataPath ../build -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            OTHER_LDFLAGS="-lz -framework IOSurface -framework Security -framework CoreFoundation -framework Network -L$(pwd)/Vendor/idevice -lidevice_ffi" \
            build 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error:|error " ../build.log | sort -u | head -60 > ../errors.txt || true
            while IFS= read -r l; do echo "::error::${l:0:400}"; done < ../errors.txt
            exit $rc
          fi
          grep -E "async-http-client|swift-nio|applepackage" ../build.log | grep -iE "resolved|checking out|Fetched" | sort -u | head -20
      - name: Đóng gói IPA
        run: |
          APP=$(find build -name "iOSToolkit.app" -path "*Release-iphoneos*" | head -1)
          echo "APP=$APP"
          mkdir -p ipa/Payload out
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../out/iOSToolkit.ipa Payload
          ls -la ../out
      - name: Phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "tk-${{ github.run_number }}" out/iOSToolkit.ipa --title "iOS Toolkit build ${{ github.run_number }}" --notes "iOS Toolkit - bo cong cu cho iOS"
      - uses: actions/upload-artifact@v4
        with: { name: iOSToolkit-ipa, path: out/ }

# Rebuild requested by maintainer: package the current feature/apple-music-injection source.
